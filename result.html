<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">

<head>
<meta charset="UTF-8">
<title>民間魔法検索</title>
<style>
.tag {
    cursor: pointer;
    color: blue;

    text-decoration: underline;

    margin: 5px;
    font-weight: bold;
}

.tag:hover {
    color: darkblue;
}
</style>
</head>

<body>

<h1>どんな魔法をお探しですか？</h1>

<div th:if="${result}">

    <p th:utext="'おすすめの民間魔法: ' + ${result}"></p>

</div>

<form action="/magic" method="get">

    <input type="text"
           name="input"
		   id="inputBox"
           placeholder="例: 掃除したい">
		   <br><br>
	<span class="tag" onclick="setSample('おいしい大豆')">#おいしい大豆</span>
	<span class="tag" onclick="setSample('花')">#花</span>
	<span class="tag" onclick="setSample('冷たい水')">#冷たい水</span>
    <span class="tag" onclick="setSample('アイディアがわかない')">#アイディアがわかない</span>
	<span class="tag" onclick="setSample('リンゴ味のハイチュウ')">#リンゴ味のハイチュウ</span>
	<br><br>
	<span class="tag" onclick="setSample('キーケンパ')">#キーケンパ</span>
	<span class="tag" onclick="setSample('血糖値')">#血糖値</span>
	<span class="tag" onclick="setSample('向こう岸に渡りたい')">#向こう岸に渡りたい</span>
	<span class="tag" onclick="setSample('ヒーロー')">#ヒーロー</span>
	<span class="tag" onclick="setSample('自由研究')">#自由研究</span>
	<span class="tag" onclick="setSample('ウィンドウォッシャー')">#ウィンドウォッシャー</span>
	<span class="tag" onclick="setSample('体を鍛える')">#体を鍛える</span>
	<script>
	function setSample(value) {
	    document.getElementById("inputBox").value = value;}
	</script>	  

    <br><br>

    <button type="submit">
        魔法を探す
    </button>

</form>

</body>
</html>
